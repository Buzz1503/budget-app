name: iOS build check

# Compiles the iPhone app, its widgets and Live Activity, the Screen Time
# monitor, the Apple Watch app and the Watch widgets on a Mac, without signing, and runs the PepitoKit Swift
# tests, so a Swift error shows up here rather than on Buzz's laptop. It
# installs nothing anywhere and does not touch the Pages deploy.
on:
  push:
    branches: [native-health, native-stage3, native-design, compound-cycling, stock-tracking, sauna-health, sleep-lab]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PepitoKit Swift tests
        working-directory: ios/PepitoKit
        run: swift test

      - name: Build the native web bundle and sync it into ios/
        run: |
          npm run build:native
          npx cap sync ios

      - name: iPhone app (embeds the widgets and the Watch app)
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > /tmp/xb.log 2>&1; rc=$?; grep -E 'error:|BUILD (SUCCEEDED|FAILED)' /tmp/xb.log | sort -u | head -80; exit $rc

      - name: Widget extension
        if: always()
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme PepitoWidgets -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > /tmp/xb.log 2>&1; rc=$?; grep -E 'error:|BUILD (SUCCEEDED|FAILED)' /tmp/xb.log | sort -u | head -80; exit $rc

      - name: Screen Time monitor extension
        if: always()
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme PepitoLateUse -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > /tmp/xb.log 2>&1; rc=$?; grep -E 'error:|BUILD (SUCCEEDED|FAILED)' /tmp/xb.log | sort -u | head -80; exit $rc

      - name: Watch app
        if: always()
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme PepitoWatch -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > /tmp/xb.log 2>&1; rc=$?; grep -E 'error:|BUILD (SUCCEEDED|FAILED)' /tmp/xb.log | sort -u | head -80; exit $rc

      - name: Watch widgets
        if: always()
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme PepitoWatchWidgets -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > /tmp/xb.log 2>&1; rc=$?; grep -E 'error:|BUILD (SUCCEEDED|FAILED)' /tmp/xb.log | sort -u | head -80; exit $rc

  # Renders every widget, the Live Activity and every Watch screen to PNG
  # (ios/PepitoKit/Tests/PepitoSnapshotTests) and commits them to
  # design-snapshots/ on the same branch, so the design can be reviewed image
  # by image. The commit says [skip ci].
  snapshots:
    runs-on: macos-latest
    concurrency:
      group: snapshots-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Pick an iPhone and an Apple Watch simulator
        id: sims
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > /tmp/sims.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('/tmp/sims.json'))['devices']
          def pick(runtime_key, prefs):
              devs = [x for k, v in d.items() if runtime_key in k for x in v if x.get('isAvailable')]
              for p in prefs:
                  for x in devs:
                      if x['name'].startswith(p):
                          return x['udid']
              return devs[-1]['udid'] if devs else ''
          print('iphone=' + pick('iOS', ['iPhone 16 Pro', 'iPhone 15 Pro', 'iPhone']))
          print('watch=' + pick('watchOS', ['Apple Watch Ultra 2', 'Apple Watch Ultra', 'Apple Watch Series 10', 'Apple Watch']))
          PY
          cat "$GITHUB_OUTPUT"

      - name: Render iPhone widgets and Live Activity
        working-directory: ios/PepitoKit
        run: |
          xcodebuild test -scheme PepitoKit-Package -destination "id=${{ steps.sims.outputs.iphone }}" \
            -only-testing:PepitoSnapshotTests -skipPackagePluginValidation > /tmp/xt.log 2>&1; rc=$?; grep -E 'error:|failed|TEST (SUCCEEDED|FAILED)|Executed' /tmp/xt.log | sort -u | head -80; exit $rc

      - name: Render Watch screens and complications
        if: always()
        working-directory: ios/PepitoKit
        run: |
          xcodebuild test -scheme PepitoKit-Package -destination "id=${{ steps.sims.outputs.watch }}" \
            -only-testing:PepitoSnapshotTests -skipPackagePluginValidation > /tmp/xt.log 2>&1; rc=$?; grep -E 'error:|failed|TEST (SUCCEEDED|FAILED)|Executed' /tmp/xt.log | sort -u | head -80; exit $rc

      - name: Commit the snapshots to the branch
        if: always()
        run: |
          ls design-snapshots | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add design-snapshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Design snapshots [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
