<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Budget 101</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        /* --- Base & Variables --- */
        :root {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.9);
            --card-bg-light: rgba(44, 44, 46, 0.9);
            --card-stroke: rgba(84, 84, 88, 0.65);
            --text-primary: #FFFFFF;
            --text-secondary: #AEAEB2;
            --accent-cyan: #00A9FF;
            --accent-blue: #007AFF;
            --accent-green: #30D158;
            --accent-pink: #FF2D55;
            --accent-orange: #FF9500;
            --accent-red: #FF3B30;
            --accent-purple: #AF52DE;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overscroll-behavior: none;
        }

        /* --- App Layout --- */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #app-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1rem 1rem 80px 1rem; 
            position: relative;
        }

        .view {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .view.active-view {
            display: flex;
        }

        /* --- Splash Screen --- */
        #home-view {
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
            gap: 1.5rem;
            background: linear-gradient(160deg, #000000 50%, #1D2B64 100%);
        }

        .splash-icon {
            font-size: 7rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 30px var(--accent-cyan);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #home-view h1 {
            font-size: 3rem;
            font-weight: 800;
            margin: 0;
        }
        #home-view p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin: 0;
        }
        #get-started-btn {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--bg-color);
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 2rem;
            box-shadow: 0 5px 20px rgba(0, 122, 255, 0.4);
            transition: transform 0.2s ease;
        }
        #get-started-btn:active {
            transform: scale(0.95);
        }

        /* --- Tab Bar --- */
        #tab-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: auto; 
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-stroke);
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 10px;
            padding-bottom: calc(env(safe-area-inset-bottom, 10px));
        }

        .tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            gap: 4px;
            padding: 5px;
            flex: 1;
        }
        .tab-btn i {
            font-size: 1.5rem;
        }
        .tab-btn.active {
            color: var(--accent-cyan);
        }

        /* --- Generic Components --- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-stroke);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .card-header {
            font-size: 1.5rem;
            font-weight: bold;
        }
        h2.section-title {
            font-size: 1.75rem;
            font-weight: bold;
            margin: 0 0 0.5rem 0;
        }
        hr {
            border: none;
            height: 1px;
            background-color: var(--card-stroke);
            width: 100%;
            margin: 0.5rem 0;
        }
        input[type="number"], input[type="time"], select {
            background-color: #3A3A3C;
            border: 1px solid #545458;
            color: white;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 1rem;
            width: 120px;
            text-align: right;
            -moz-appearance: textfield;
        }
        select { text-align: left; }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        button, a {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .action-button {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            color: black;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 1rem;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Payday View Totals/Surplus --- */
        .totals-summary {
            padding: 0.75rem 1rem;
            margin-top: 0.5rem;
            border-radius: 12px;
            font-weight: bold;
        }

        /* --- Payday Countdown Card --- */
        .payday-countdown-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }
        .countdown-circle {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .countdown-days {
            font-size: 2rem;
            font-weight: bold;
        }
        .countdown-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* --- Payment Card --- */
        .payment-card {
            background-color: var(--card-bg-light);
            border: 1px solid var(--card-stroke);
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: opacity 0.3s;
        }
        .payment-card-main {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .payment-card-details {
            flex-grow: 1;
        }
        .payment-card-dest {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .payment-card-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .payment-card-actions .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .copy-btn {
            background: rgba(0, 122, 255, 0.2);
            color: var(--accent-cyan);
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
        }
        .payment-amount-input {
            width: 100px;
            padding: 6px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .savings-label {
            font-size: 0.8rem;
            font-style: italic;
            color: var(--accent-green);
            margin-left: 0.5rem;
        }

        /* --- Donut Chart (Audit & Savings) --- */
        .donut-chart {
            position: relative;
            border-radius: 50%;
            display: grid;
            place-items: center;
        }
        .donut-chart-center {
            grid-area: 1 / 1;
            text-align: center;
        }
        .donut-chart-emoji {
            font-size: 2.5rem;
        }
        .donut-chart-percent {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .audit-details, .savings-goal-details {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .audit-details .row, .savings-goal-details .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Savings Goal Card --- */
        .savings-goal-card {
            padding: 1.5rem;
            border-radius: 20px;
            border-width: 2px;
            border-style: solid;
            background: linear-gradient(135deg, rgba(58, 58, 60, 0.5), rgba(44, 44, 46, 0.5));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
        }
        .savings-goal-chart {
            width: 120px;
            height: 120px;
        }
        .savings-goal-details {
            text-align: center;
        }
        .savings-goal-details .name {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* --- Settings Toggle Switch --- */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 51px;
            height: 31px;
        }
        .toggle-switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #39393D;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 27px;
            width: 27px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-green);
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* --- Automation Guide --- */
        .automation-card ul {
            padding-left: 20px;
            margin: 0;
            color: var(--text-secondary);
        }
        .automation-card li {
            margin-bottom: 0.5rem;
        }
        .automation-card strong {
            color: var(--text-primary);
        }


        /* --- Toast Notification --- */
        .toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(48, 209, 88, 0.95);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 1000;
            transition: top 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .toast.show {
            top: 20px;
        }

        /* --- Confetti --- */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: fall 3s linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* Modal Dialog for Reset */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-backdrop.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-dialog {
            background: var(--card-bg-light);
            border-radius: 14px;
            padding: 1.5rem;
            width: 85%;
            max-width: 350px;
            text-align: center;
            border: 1px solid var(--card-stroke);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        .modal-backdrop.visible .modal-dialog {
            transform: scale(1);
        }
        .modal-dialog h3 {
            margin-top: 0;
        }
        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .modal-actions button {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
        }
        .modal-cancel {
            background-color: #555;
            color: white;
        }
        .modal-confirm {
            background-color: var(--accent-red);
            color: white;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Toast Notification -->
        <div id="toast" class="toast"></div>
        <!-- Confetti -->
        <div id="confetti-container"></div>
        <!-- Modal -->
        <div id="reset-modal" class="modal-backdrop">
            <div class="modal-dialog">
                <h3>Reset All Data</h3>
                <p>This will permanently delete all your savings progress, audit data, and reset all tasks. This action cannot be undone.</p>
                <div class="modal-actions">
                    <button id="modal-cancel-btn" class="modal-cancel">Cancel</button>
                    <button id="modal-confirm-btn" class="modal-confirm">Reset</button>
                </div>
            </div>
        </div>

        <!-- App Content -->
        <main id="app-content">
            <!-- Splash Screen -->
            <section id="home-view" class="view active-view">
                <i class="fas fa-dollar-sign splash-icon"></i>
                <h1>Budget 101</h1>
                <p>Your Financial Journey Simplified</p>
                <button id="get-started-btn">Get Started</button>
            </section>

            <!-- Main Views (populated by JS) -->
            <section id="income-view" class="view"></section>
            <section id="payday-view" class="view"></section>
            <section id="audit-view" class="view"></section>
            <section id="insights-view" class="view"></section>
            <section id="settings-view" class="view"></section>
        </main>

        <!-- Tab Bar -->
        <nav id="tab-bar">
            <button class="tab-btn active" data-view="income-view"><i class="fas fa-dollar-sign"></i><span>Income</span></button>
            <button class="tab-btn" data-view="payday-view"><i class="fas fa-tasks"></i><span>Payday</span></button>
            <button class="tab-btn" data-view="audit-view"><i class="fas fa-chart-pie"></i><span>Audit</span></button>
            <button class="tab-btn" data-view="insights-view"><i class="fas fa-lightbulb"></i><span>Insights</span></button>
            <button class="tab-btn" data-view="settings-view"><i class="fas fa-cog"></i><span>Settings</span></button>
        </nav>
    </div>

    <script>
    // --- All your JavaScript from above here ---
    // ... Full code provided in the previous step ...
    </script>
</body>
</html>
